<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RD MULTIVERSOS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Exo+2:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#04060e;color:#fff;font-family:'Exo 2',sans-serif}
.hero{width:100%;min-height:100vh;background:#000 url('saturn-8k.png') center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0.15) 0%,rgba(4,6,14,0.92) 85%)}
.content{position:relative;z-index:2;padding:20px;max-width:1000px}
.logo{width:100%;max-width:780px;filter:drop-shadow(0 0 60px rgba(100,200,255,0.8)) drop-shadow(0 0 120px rgba(0,120,255,0.4))}
h1{font-family:'Orbitron';font-size:clamp(28px,6vw,62px);font-weight:900;margin-top:30px;background:linear-gradient(180deg,#fff 30%,#7de2ff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:0.05em}
.sub{font-family:'Orbitron';font-size:clamp(10px,1.8vw,14px);letter-spacing:0.45em;color:#7de2ff;margin-top:18px}
.btn{margin-top:45px;display:inline-block;padding:18px 52px;border:1.5px solid #7de2ff;border-radius:100px;color:#7de2ff;text-decoration:none;font-family:'Orbitron';font-size:13px;letter-spacing:0.2em;box-shadow:0 0 30px rgba(125,226,255,0.3);transition:0.3s}
.btn:hover{background:#7de2ff;color:#04060e;box-shadow:0 0 60px rgba(125,226,255,0.7)}
</style>
</head>
<body>
<div class="hero">
<div class="content">
<img src="rd-logo-4k.png" class="logo" alt="RD MULTIVERSOS">
<h1>Explore o Infinito</h1>
<div class="sub">MULTIVERSOS - PORTAIS - UNIVERSOS PARALELOS</div>
<a href="#" class="btn">ENTRAR NO PORTAL</a>
</div>
</div>
</body>
</html>
