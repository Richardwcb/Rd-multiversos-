<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RD MULTIVERSOS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000 url('saturn-8k.png') no-repeat center center fixed;
    background-size:cover;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .logo-container{width:90%;max-width:900px;margin-bottom:20px}
  .logo-container img{width:100%;height:auto;filter:drop-shadow(0 0 20px #00d4ff)}
  h1{font-size:2.2rem;letter-spacing:2px;color:#a0f0ff;text-shadow:0 0 15px #00d4ff;margin:20px 0 10px}
  p{font-size:0.8rem;letter-spacing:4px;color:#7dd3e0;margin-bottom:30px}
  .btn{background:#7de8ff;color:#000;padding:18px 40px;border-radius:50px;font-weight:900;letter-spacing:2px;border:none;font-size:0.9rem;box-shadow:0 0 30px rgba(125,232,255,0.6)}
</style>
</head>
<body>
  <div class="logo-container">
    <img src="rd-logo-4k.png" alt="RD MULTIVERSOS">
  </div>
  <h1>Explore o Infinito</h1>
  <p>MULTIVERSOS - PORTAIS - UNIVERSOS PARALELOS</p>
  <button class="btn">ENTRAR NO PORTAL</button>
</body>
</html>
